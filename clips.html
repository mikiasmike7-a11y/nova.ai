<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIS Tech | Reels & Clips Feed</title>
    <script>
        if (localStorage.getItem('nova_authenticated') !== 'true') { window.location.href = "login.html"; }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background: #000000; color: #ffffff; line-height: 1.5; display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }
        
        /* Navigation Header */
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 6%; background: rgba(17, 24, 39, 0.94); border-bottom: 1px solid #1f2937; position: sticky; top: 0; z-index: 100; flex-wrap: wrap; gap: 10px; }
        .logo { font-size: 20px; font-weight: bold; color: #38bdf8; }
        nav { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        nav a { color: #d1d5db; text-decoration: none; font-size: 13px; font-weight: 500; }
        nav a:hover { color: #38bdf8; }
        .btn-logout { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid #ef4444; padding: 4px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: bold; }

        /* Upload Studio Box */
        .upload-wrapper { max-width: 470px; width: 100%; margin: 20px auto; background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 20px; }
        .upload-wrapper h3 { font-size: 15px; color: #38bdf8; margin-bottom: 10px; }
        .form-group { margin-bottom: 10px; }
        .form-group input { width: 100%; background: #1f2937; border: 1px solid #374151; border-radius: 8px; padding: 9px 12px; color: white; font-size: 13px; outline: none; }
        .file-label { background: #1f2937; border: 1px dashed #38bdf8; padding: 10px; border-radius: 8px; font-size: 12px; color: #38bdf8; cursor: pointer; display: block; text-align: center; margin-bottom: 10px; }
        .btn-publish { background: #2563eb; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; width: 100%; }

        /* Reels / TikTok Feed Container */
        .reels-feed-container { display: flex; flex-direction: column; align-items: center; gap: 40px; padding: 20px 0 60px 0; }

        /* Exact Instagram Reels / TikTok Card Style */
        .reel-card { position: relative; width: 100%; max-width: 470px; height: 750px; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid #262626; box-shadow: 0 10px 30px rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; }
        
        .reel-video { width: 100%; height: 100%; object-fit: cover; }

        /* Text Overlay on Video (Like "Bro to bro how are you?") */
        .video-text-overlay { position: absolute; top: 18%; width: 85%; text-align: center; font-size: 20px; font-weight: 500; color: #ffffff; text-shadow: 0 2px 8px rgba(0,0,0,0.9); z-index: 5; line-height: 1.4; }

        /* Bottom Creator Overlay */
        .reel-bottom-info { position: absolute; bottom: 20px; left: 15px; z-index: 5; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .reel-creator { font-size: 14px; font-weight: 600; color: #ffffff; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
        .reel-caption { font-size: 13px; color: #f3f4f6; }

        /* Right Side Action Buttons (Exact IG Style) */
        .reel-side-actions { position: absolute; right: 15px; bottom: 25px; display: flex; flex-direction: column; align-items: center; gap: 18px; z-index: 10; }
        .side-action-btn { background: none; border: none; display: flex; flex-direction: column; align-items: center; color: white; cursor: pointer; font-size: 22px; transition: 0.2s; }
        .side-action-btn:hover { transform: scale(1.1); color: #38bdf8; }
        .side-action-btn.active { color: #ef4444; }
        .side-action-count { font-size: 12px; font-weight: 600; margin-top: 3px; color: #ffffff; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
        
        /* Audio Mute Button at Bottom Right */
        .mute-toggle-btn { position: absolute; right: 15px; bottom: 15px; background: rgba(0, 0, 0, 0.6); border: none; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; z-index: 10; font-size: 14px; }
    </style>
</head>
<body onload="loadReelsFeed()">
    <header>
        <div class="logo">BIS Reels 🎬</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="clips.html" style="color: #38bdf8; font-weight: bold;">🎬 Reels Feed</a>
            <a href="profile.html">👤 Profile</a>
            <a href="career.html">Career</a>
            <a href="company.html">Employer</a>
            <a href="chat.html">Messages</a>
            <a href="live.html">Live</a>
            <a href="payment.html">VIP Checkout</a>
            <a href="admin.html" style="color: #ef4444;">⚙️ Admin</a>
            <button class="btn-logout" onclick="localStorage.removeItem('nova_authenticated'); window.location.href='login.html';">🚪 Logout</button>
        </nav>
    </header>

    <!-- Upload Studio -->
    <div class="upload-wrapper">
        <h3>🎥 Create & Post New Reel</h3>
        <label for="reelFileInput" class="file-label" id="fileLabelText">📁 Choose Video (.mp4)</label>
        <input type="file" id="reelFileInput" accept="video/*" style="display: none;" onchange="handleFileSelect(event)">
        
        <div class="form-group">
            <input type="text" id="reelCaptionInput" placeholder="Write video text / caption (e.g. Bro to bro how are you?)...">
        </div>
        <button class="btn-publish" onclick="publishNewReel()">Post Reel to Feed & Profile 🚀</button>
    </div>

    <!-- Reels Vertical Feed Container -->
    <div class="reels-feed-container" id="reelsFeedContainer">
        <!-- Dynamic & Sample Reels will load here -->
    </div>

    <script>
        let selectedVideoUrl = "";

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                selectedVideoUrl = URL.createObjectURL(file);
                document.getElementById('fileLabelText').innerText = "✅ Video Selected: " + file.name;
            }
        }

        function publishNewReel() {
            let caption = document.getElementById('reelCaptionInput').value.trim();
            if(!caption) return alert("⚠️ Please enter a caption or text for your reel.");
            if(!selectedVideoUrl) {
                selectedVideoUrl = "https://www.w3schools.com/html/mov_bbb.mp4";
            }

            let currentUser = localStorage.getItem('nova_user') || 'mi_ke.60';

            let newReel = {
                username: currentUser,
                caption: caption,
                videoUrl: selectedVideoUrl,
                likes: "1,240",
                comments: "338",
                shares: "331",
                saves: "2,761"
            };

            let existingPosts = JSON.parse(localStorage.getItem('nova_user_posts') || '[]');
            existingPosts.unshift(newReel);
            localStorage.setItem('nova_user_posts', JSON.stringify(existingPosts));

            alert("🚀 Reel posted successfully! Now visible in your Reels feed & profile.");
            location.reload();
        }

        function loadReelsFeed() {
            let container = document.getElementById('reelsFeedContainer');
            let existingPosts = JSON.parse(localStorage.getItem('nova_user_posts') || '[]');

            // Default sample reel matching your exact screenshot design if no custom posts exist
            let sampleReels = [
                {
                    username: "mi_ke.60 🌟",
                    caption: "Bro to bro how are you?",
                    videoUrl: "https://www.w3schools.com/html/mov_bbb.mp4",
                    likes: "13.4K",
                    comments: "338",
                    shares: "331",
                    saves: "2,761"
                },
                {
                    username: "BIS_Tech_Official 🇪🇹",
                    caption: "Building the future of digital innovation and AI platforms in Ethiopia!",
                    videoUrl: "https://www.w3schools.com/html/mov_bbb.mp4",
                    likes: "4,512",
                    comments: "142",
                    shares: "89",
                    saves: "1,050"
                }
            ];

            // Combine user posted reels with sample reels
            let allReels = [...existingPosts, ...sampleReels];

            container.innerHTML = "";
            allReels.forEach((reel, index) => {
                let cardHTML = `
                    <div class="reel-card">
                        <video class="reel-video" src="${reel.videoUrl}" loop autoplay muted playsinline id="video-${index}"></video>
                        
                        <!-- Video Text Overlay -->
                        <div class="video-text-overlay">${reel.caption}</div>

                        <!-- Bottom Creator Info -->
                        <div class="reel-bottom-info">
                            <div class="reel-creator">@${reel.username}</div>
                            <div class="reel-caption">${reel.caption}</div>
                        </div>

                        <!-- Right Side Action Buttons (Instagram Style) -->
                        <div class="reel-side-actions">
                            <button class="side-action-btn" onclick="toggleLike(this)">
                                ❤️
                                <span class="side-action-count">${reel.likes}</span>
                            </button>
                            <button class="side-action-btn" onclick="alert('Open comments drawer')">
                                💬
                                <span class="side-action-count">${reel.comments}</span>
                            </button>
                            <button class="side-action-btn" onclick="alert('Reel reposted!')">
                                🔁
                                <span class="side-action-count">${reel.shares}</span>
                            </button>
                            <button class="side-action-btn" onclick="alert('Reel shared successfully!')">
                                ✈️
                                <span class="side-action-count">${reel.saves}</span>
                            </button>
                            <button class="side-action-btn" onclick="alert('Saved to collection!')">
                                🔖
                            </button>
                            <button class="side-action-btn" style="font-size: 16px;">
                                •••
                            </button>
                            <div style="width: 28px; height: 28px; border-radius: 50%; overflow: hidden; border: 2px solid white; margin-top: 5px;">
                                <div style="width:100%; height:100%; background:#38bdf8; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:bold; color:#000;">MK</div>
                            </div>
                        </div>

                        <!-- Mute / Unmute Button -->
                        <button class="mute-toggle-btn" onclick="toggleMute('video-${index}', this)">🔇</button>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        function toggleLike(btn) {
            btn.classList.toggle('active');
            if(btn.classList.contains('active')) {
                alert("❤️ Liked reel!");
            }
        }

        function toggleMute(videoId, btn) {
            let vid = document.getElementById(videoId);
            vid.muted = !vid.muted;
            btn.innerText = vid.muted ? "🔇" : "🔊";
        }
    </script>
</body>
</html>
