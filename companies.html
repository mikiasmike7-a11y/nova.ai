<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIS Tech | Ethiopian Companies Directory</title>
    <script>
        if (localStorage.getItem('nova_authenticated') !== 'true') { window.location.href = "login.html"; }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background: #0b0f19; color: #ffffff; line-height: 1.5; }
        
        /* Navigation Header */
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background: rgba(17, 24, 39, 0.94); border-bottom: 1px solid #1f2937; position: sticky; top: 0; z-index: 100; flex-wrap: wrap; gap: 10px; }
        .logo { font-size: 20px; font-weight: bold; color: #38bdf8; }
        nav { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        nav a { color: #d1d5db; text-decoration: none; font-size: 13px; font-weight: 500; }
        nav a:hover, nav a.active { color: #38bdf8; }
        .btn-logout { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid #ef4444; padding: 4px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: bold; }

        .portal-container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }

        /* Top Search & Register Bar */
        .action-bar { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 20px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .search-box { flex-grow: 1; min-width: 250px; background: #1f2937; border: 1px solid #374151; border-radius: 8px; padding: 10px 15px; display: flex; align-items: center; gap: 10px; }
        .search-box input { width: 100%; background: transparent; border: none; outline: none; color: white; font-size: 13px; }
        .btn-register-corp { background: #10b981; color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; white-space: nowrap; }
        .btn-register-corp:hover { background: #059669; }

        /* Layout */
        .main-layout { display: grid; grid-template-columns: 250px 1fr; gap: 25px; }
        @media(max-width: 850px) { .main-layout { grid-template-columns: 1fr; } }

        /* Sidebar Filter */
        .sidebar-filter { background: #111827; border: 1px solid #1f2937; border-radius: 10px; padding: 20px; height: fit-content; }
        .filter-title { font-size: 14px; font-weight: bold; color: #38bdf8; margin-bottom: 12px; border-bottom: 1px solid #1f2937; padding-bottom: 8px; }
        .sector-item { padding: 8px 10px; font-size: 13px; color: #d1d5db; cursor: pointer; border-radius: 6px; margin-bottom: 4px; transition: 0.2s; }
        .sector-item:hover, .sector-item.active { background: rgba(56, 189, 248, 0.15); color: #38bdf8; font-weight: bold; }

        /* Companies Grid */
        .companies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .company-card { background: #111827; border: 1px solid #1f2937; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; transition: 0.2s; }
        .company-card:hover { border-color: #38bdf8; transform: translateY(-2px); }
        
        .company-card-top { padding: 20px; text-align: center; }
        .company-logo-box { width: 55px; height: 55px; background: #1e293b; border-radius: 10px; margin: 0 auto 12px auto; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; color: #38bdf8; border: 1px solid #334155; }
        .company-name { font-size: 15px; font-weight: bold; color: #ffffff; margin-bottom: 4px; text-decoration: none; display: block; }
        .company-name:hover { color: #38bdf8; }
        .company-loc { font-size: 12px; color: #9ca3af; margin-bottom: 6px; }
        .company-sector-badge { display: inline-block; background: rgba(56, 189, 248, 0.1); color: #38bdf8; padding: 2px 8px; border-radius: 4px; font-size: 11px; }

        .company-card-bottom { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid #1f2937; background: #0f172a; text-align: center; font-size: 12px; }
        .card-stat { padding: 10px; border-right: 1px solid #1f2937; color: #9ca3af; }
        .card-stat b { display: block; color: #10b981; font-size: 13px; }
        .card-action { padding: 10px; color: #38bdf8; font-weight: bold; cursor: pointer; background: transparent; border: none; font-size: 12px; }
        .card-action:hover { background: rgba(56, 189, 248, 0.1); }

        /* Modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: #111827; border: 1px solid #374151; border-radius: 12px; width: 100%; max-width: 480px; padding: 25px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; color: #d1d5db; margin-bottom: 4px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; background: #1f2937; border: 1px solid #374151; border-radius: 6px; padding: 10px; color: white; font-size: 13px; outline: none; }
    </style>
</head>
<body onload="loadCompanies()">
    <header>
        <div class="logo">BIS Tech 🏢 Companies</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="clips.html">Clips</a>
            <a href="profile.html">Profile</a>
            <a href="career.html">💼 Career Portal</a>
            <a href="companies.html" style="color: #38bdf8; font-weight: bold;">🏢 Companies</a>
            <a href="cv_builder.html">📄 AI CV Builder</a>
            <a href="chat.html">Messages</a>
            <a href="admin.html" style="color: #ef4444;">⚙️ Admin</a>
            <button class="btn-logout" onclick="localStorage.removeItem('nova_authenticated'); window.location.href='login.html';">🚪 Logout</button>
        </nav>
    </header>

    <div class="portal-container">
        <div class="action-bar">
            <div class="search-box">
                <span>🔍</span>
                <input type="text" id="compSearchInput" placeholder="Search registered Ethiopian companies..." onkeyup="searchCompanies()">
            </div>
            <button class="btn-register-corp" onclick="openCompModal()">➕ Register Your Company</button>
        </div>

        <div class="main-layout">
            <!-- Industry Sidebar -->
            <div class="sidebar-filter">
                <div class="filter-title">Filter by Sector</div>
                <div class="sector-item active" onclick="filterSector('All', this)">All Industries</div>
                <div class="sector-item" onclick="filterSector('Banking', this)">🏦 Banking & Finance</div>
                <div class="sector-item" onclick="filterSector('ICT', this)">💻 ICT & Software</div>
                <div class="sector-item" onclick="filterSector('Telecom', this)">📡 Telecom & Network</div>
                <div class="sector-item" onclick="filterSector('Engineering', this)">⚙️ Engineering</div>
            </div>

            <!-- Companies Grid -->
            <div class="companies-grid" id="companiesGrid"></div>
        </div>
    </div>

    <!-- Register Company Modal -->
    <div class="modal-overlay" id="compModal">
        <div class="modal-content">
            <h3 style="color: #38bdf8; margin-bottom: 15px;">🏢 Register New Company</h3>
            <div class="form-group"><label>Company Name *</label><input type="text" id="cName" placeholder="e.g. Ethio Telecom / Dashen Bank"></div>
            <div class="form-group"><label>Sector *</label>
                <select id="cSector">
                    <option value="Banking">Banking & Finance</option>
                    <option value="ICT">ICT & Software</option>
                    <option value="Telecom">Telecom & Network</option>
                    <option value="Engineering">Engineering</option>
                </select>
            </div>
            <div class="form-group"><label>Location *</label><input type="text" id="cLoc" value="Addis Ababa, Ethiopia"></div>
            <div class="form-group"><label>Phone Number *</label><input type="text" id="cPhone" placeholder="+251 911..."></div>
            <div class="form-group"><label>Company Description *</label><textarea id="cDesc" rows="3" placeholder="Describe what your company does..."></textarea></div>
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button class="btn-register-corp" style="flex: 1;" onclick="saveCompany()">Publish Company 🚀</button>
                <button class="btn-register-corp" style="flex: 1; background: #374151;" onclick="closeCompModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const defaultCompanies = [
            { id: 'abay', name: 'Abay Bank S.C.', sector: 'Banking', loc: 'Addis Ababa, Jomo Kenyatta Ave', phone: '+251 930 328 145', jobs: 7, desc: 'Leading private commercial bank in Ethiopia providing modern banking and digital financial services.' },
            { id: 'macrovian', name: 'Macrovian Technology P.L.C', sector: 'ICT', loc: 'Bole, Addis Ababa', phone: '+251 911 223 344', jobs: 3, desc: 'Enterprise IT support, network security infrastructure, and software development company.' },
            { id: 'bistech', name: 'Best Life Solutions (BIS Tech)', sector: 'ICT', loc: 'Addis Ababa, Ethiopia', phone: '+251 900 112 233', jobs: 5, desc: 'All-in-one Ethiopian digital ecosystem combining career recruitment, AI tools, and media.' },
            { id: 'ethiotel', name: 'Ethio Telecom', sector: 'Telecom', loc: 'Churchill Avenue, Addis Ababa', phone: '+251 115 515 777', jobs: 12, desc: 'National telecommunications and digital financial services (Telebirr) provider.' }
        ];

        function loadCompanies(sectorFilter = 'All') {
            let grid = document.getElementById('companiesGrid');
            let custom = JSON.parse(localStorage.getItem('nova_custom_companies') || '[]');
            let all = [...custom, ...defaultCompanies];
            grid.innerHTML = "";

            let filtered = all.filter(c => sectorFilter === 'All' || c.sector === sectorFilter);

            filtered.forEach(comp => {
                grid.insertAdjacentHTML('beforeend', `
                    <div class="company-card">
                        <div class="company-card-top">
                            <div class="company-logo-box">${comp.name.substring(0,2).toUpperCase()}</div>
                            <a href="company_profile.html?id=${comp.id}" class="company-name">${comp.name}</a>
                            <div class="company-loc">📍 ${comp.loc}</div>
                            <span class="company-sector-badge">${comp.sector}</span>
                        </div>
                        <div class="company-card-bottom">
                            <div class="card-stat"><b>${comp.jobs || 1} Jobs</b>Active</div>
                            <button class="card-action" onclick="window.location.href='company_profile.html?id=${comp.id}'">View Profile →</button>
                        </div>
                    </div>
                `);
            });
        }

        function filterSector(sec, el) {
            document.querySelectorAll('.sector-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            loadCompanies(sec);
        }

        function searchCompanies() {
            let q = document.getElementById('compSearchInput').value.toLowerCase();
            let all = [...JSON.parse(localStorage.getItem('nova_custom_companies') || '[]'), ...defaultCompanies];
            let grid = document.getElementById('companiesGrid');
            grid.innerHTML = "";
            all.filter(c => c.name.toLowerCase().includes(q) || c.sector.toLowerCase().includes(q)).forEach(comp => {
                grid.insertAdjacentHTML('beforeend', `
                    <div class="company-card">
                        <div class="company-card-top">
                            <div class="company-logo-box">${comp.name.substring(0,2).toUpperCase()}</div>
                            <a href="company_profile.html?id=${comp.id}" class="company-name">${comp.name}</a>
                            <div class="company-loc">📍 ${comp.loc}</div>
                            <span class="company-sector-badge">${comp.sector}</span>
                        </div>
                        <div class="company-card-bottom">
                            <div class="card-stat"><b>${comp.jobs || 1} Jobs</b>Active</div>
                            <button class="card-action" onclick="window.location.href='company_profile.html?id=${comp.id}'">View Profile →</button>
                        </div>
                    </div>
                `);
            });
        }

        function openCompModal() { document.getElementById('compModal').style.display = 'flex'; }
        function closeCompModal() { document.getElementById('compModal').style.display = 'none'; }

        function saveCompany() {
            let name = document.getElementById('cName').value.trim();
            let desc = document.getElementById('cDesc').value.trim();
            if(!name || !desc) return alert("⚠️ Please enter company name and description.");

            let newComp = {
                id: 'comp_' + Date.now(),
                name: name,
                sector: document.getElementById('cSector').value,
                loc: document.getElementById('cLoc').value.trim(),
                phone: document.getElementById('cPhone').value.trim() || '+251 900 000 000',
                jobs: 1,
                desc: desc
            };

            let custom = JSON.parse(localStorage.getItem('nova_custom_companies') || '[]');
            custom.unshift(newComp);
            localStorage.setItem('nova_custom_companies', JSON.stringify(custom));
            closeCompModal();
            alert("🎉 Company registered successfully!");
            loadCompanies();
        }
    </script>
</body>
</html>
